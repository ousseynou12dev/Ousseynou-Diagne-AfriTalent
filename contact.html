          <section id="form" class="py-5">
            <div class="container">
                <h2 class="text-center mb-5">Formulaire de contact</h2>
                <div class="row">
                    <!-- formulaire -->
                    <div class="col-lg-6">
                         <form action="">
                                <div class="row g-3">

                                    <!-- Nom -->
                                    <div class="col-12 col-lg-6">
                                    <label for="nom" class="form-label">Nom</label>
                                    <input class="form-control" type="text" name="nom" id="nom" placeholder="Votre nom">
                                    </div>

                                    <!-- Prénom -->
                                    <div class="col-12 col-lg-6">
                                    <label for="prenom" class="form-label">Prénom</label>
                                    <input class="form-control" type="text" name="prenom" id="prenom" placeholder="Votre prénom">
                                    </div>

                                    <!-- Email -->
                                    <div class="col-12 col-lg-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input class="form-control" type="email" name="email" id="email" placeholder="Votre email">
                                    </div>

                                    <!-- Sujet -->
                                    <div class="col-12 col-lg-6">
                                    <label for="sujet" class="form-label">Sujet</label>
                                    <select name="sujet" id="sujet" class="form-select">
                                        <option value="">-- Choisir un sujet --</option>
                                        <option value="freelance">Je suis freelance</option>
                                        <option value="entreprise">Je suis une entreprise</option>
                                        <option value="autre">Autre</option>
                                    </select>
                                    </div>

                                    <!-- Message -->
                                    <div class="col-12">
                                    <label for="message" class="form-label">Message</label>
                                    <textarea class="form-control" rows="5" name="message" id="message" placeholder="Votre message..."></textarea>
                                    </div>

                                    <!-- Bouton -->
                                    <div class="col-12">
                                    <button type="submit" class="btn btn-primary w-100">Envoyer</button>
                                    </div>

                                </div>
                          </form>
                    </div>
                    <!-- INFORMATION -->
                    <div class="col-lg-6 py-5 ">
                        <div class="d-flex  align-items-center gap-3 mb-4">
                            <i class="bi fs-5 bi-envelope text-primary" ></i>
                            <p>odiagne074@gmail.com</p>

                        </div>
                    </div>
